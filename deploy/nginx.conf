# NMRView static site. Served by nginx-unprivileged on port 8080 behind Fly.io's
# TLS-terminating proxy. Everything in the image is public, immutable build output.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable directory listings and never serve the Vite manifest.
    autoindex off;
    location ~ ^/\.vite/ { return 404; }

    # Text assets are compressed on the fly. Binary reference data
    # (.nii.gz, .bin, .wasm) is already compact and must never be re-encoded:
    # the app verifies byte lengths and SHA-256 checksums of the atlas parts.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml image/svg+xml application/manifest+json;
    gzip_static off;

    # Security headers. No CSP yet: the page carries an inline bootstrap script
    # and talks to several public repositories and OpenRouter from the browser.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed build output: cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # WebAssembly needs an explicit MIME type for streaming compilation.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # JCAMP-DX samples are plain text (listed before the /data/ rule: nginx uses the first matching regex location).
    location ~* \.(jdx|dx|jcamp)$ {
        types { text/plain jdx dx jcamp; }
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Bundled reference data and the vendored DICOM converter. Part names in
    # /data/mni-hires are stable, so keep their lifetime short enough that a
    # manifest change cannot pair with stale parts.
    location ~* ^/(data|vendor)/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The single application route. Query strings such as ?session=empty are
    # handled by the client.
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
